[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-flow"
version = "0.1.0"
description = "Agent-agnostic orchestration engine for autonomous software engineering workflows, from requirements to review-ready pull requests."
requires-python = ">=3.13,<3.14"
dependencies = [
    "rich>=13.9,<15",
]

[project.scripts]
engineering-flow = "engineering_flow.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
engineering_flow = ["default-config.toml"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
