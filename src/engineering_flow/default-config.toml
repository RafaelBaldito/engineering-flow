[provider]
name = "codex-cli"
command = "codex"
timeout_seconds = 1800

[provider.implementation.profiles.efficient]
model = "gpt-5.6-luna"
reasoning = "low"

[provider.implementation.profiles.balanced]
model = "gpt-5.6-terra"
reasoning = "medium"

[provider.implementation.profiles.strong]
model = "gpt-5.6-sol"
reasoning = "medium"

[approval]
prd = "required"
techspec = "required"
task_plan = "required"

[safety]
allow_read_only_planning = true

[execution]
max_review_cycles = 3
allow_workspace_write_development = true
allow_read_only_review = true
